server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 鈹€鈹€ 瀹夊叏 headers锛圫 瀹夊叏鍔犲浐锛夆攢鈹€
    # 闃叉鐐瑰嚮鍔寔銆丮IME 鍡呮帰銆乆SS 杩囨护
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP锛氶檺鍒惰祫婧愬姞杞芥簮锛岄槻姝?XSS/鏁版嵁娉ㄥ叆
    # 鐢熶骇閮ㄧ讲闇€灏?connect-src 鏀逛负瀹為檯 API 鍩熷悕
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self';" always;
    # HSTS锛氱敓浜?HTTPS 閮ㄧ讲鍚敤锛圚TTP 涓嬩細琚拷鐣ワ級
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 鈹€鈹€ 涓婁紶闄愬埗锛圫 瀹夊叏鍔犲浐锛氶槻澶ф枃浠?DoS锛夆攢鈹€
    # 榛樿 50MB锛岃冻澶熸枃妗?鍥剧墖涓婁紶锛涜棰戣鐢ㄤ笓鐢ㄧ鐐?    client_max_body_size 50m;

    # gzip 鍘嬬缉
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 闈欐€佽祫婧愮紦瀛?    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 鈹€鈹€ API 浠ｇ悊锛堝悓鍩熼儴缃茬敤锛夆攢鈹€
    # 鍚庣璺敱鍓嶇紑 /v1/锛宯ginx 鍙嶅悜浠ｇ悊鍒?gateway
    location /v1/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 璇诲彇瓒呮椂锛圫SE/闀胯疆璇㈤渶瑕侊級
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SSE 浠ｇ悊锛堟祦寮忓搷搴旓級
    location /events {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        # SSE 闀胯繛鎺ヨ秴鏃?        proxy_read_timeout 3600s;
    }

    # 即时对话/取消(无 /v1 前缀,由网关处理; S 修复: 此前 /submit 未代理,SSE 发送打回 index.html)
    location /submit {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    # cancel: 即时对话停止(无 /v1 前缀)
    location /cancel {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    # 媒体文件(公开 + 签名短链)由网关托底(S 修复: 此前 /media/ 未代理,媒体图 404)
    location /media/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # WebSocket 浠ｇ悊
    location /ws/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 鍋ュ悍妫€鏌ワ紙璐熻浇鍧囪　鍣ㄦ帰娲伙級
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA 璺敱锛堝墠绔?history 妯″紡锛?    location / {
        try_files $uri $uri/ /index.html;
    }

    # 鈹€鈹€ 瀹夊叏鍔犲浐锛氶殣钘?nginx 鐗堟湰 鈹€鈹€
    server_tokens off;
}
