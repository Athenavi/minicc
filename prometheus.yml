# Prometheus 閹舵挸褰囬柊宥囩枂
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # chiron Go 缂冩垵鍙?
  - job_name: 'chiron-gateway'
    metrics_path: '/metrics'
    # P1 淇锛氱綉鍏?/metrics 闇€ PermAdminRead 鎴?METRICS_TOKEN锛圔earer锛夈€?
    # 閮ㄧ讲鏃惰灏?REPLACE_WITH_METRICS_TOKEN 鏇挎崲涓?gateway 鐨?METRICS_TOKEN 鐜鍙橀噺鍊笺€?
    authorization:
      type: Bearer
      credentials: ${METRICS_TOKEN}
    static_configs:
      - targets: ['gateway:8080']
        labels:
          service: 'gateway'

  # Python AI 瀵洘鎼搁敍鍫濐洤閺?/metrics 缁旑垳鍋ｉ敍?  - job_name: 'chiron-python-engine'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['python-engine:8000']
        labels:
          service: 'python-engine'

  # Prometheus 閼奉亞娲冮幒?  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

