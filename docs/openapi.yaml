openapi: 3.0.3
info:
  title: chiron API
  description: |
    澶氱鎴?SaaS AI Agent 骞冲彴 API 鏂囨。銆?
    ## 璁よ瘉
    - 鐧诲綍鍚庣鐐硅缃?`chiron_token` httpOnly cookie
    - 鍚庣画璇锋眰鑷姩鎼哄甫 cookie锛坄withCredentials: true`锛?    - SSO 鐧诲綍閫氳繃 `/v1/auth/sso/login/{providerID}` 鍙戣捣

    ## 澶氱鎴?    - JWT claims 鍚?`tenant_id`锛屾墍鏈夋煡璇㈣嚜鍔ㄦ寜绉熸埛闅旂
    - 浼佷笟鍔熻兘闇€ `audit:read`/`ent:manage`/`policy:manage`/`market:manage`/`sso:manage` 鏉冮檺鐐?  version: 1.0.0
  contact:
    name: chiron
servers:
  - url: http://localhost:8080
    description: 鏈湴寮€鍙?  - url: https://api.chiron.example.com
    description: 鐢熶骇

tags:
  - name: auth
    description: 璁よ瘉涓庝細璇?  - name: chat
    description: AI 瀵硅瘽
  - name: enterprise
    description: 浼佷笟鍔熻兘锛堥渶浼佷笟鏉冮檺鐐癸級
  - name: sso
    description: 鍗曠偣鐧诲綍
  - name: system
    description: 绯荤粺鐩戞帶

paths:
  # 鈹€鈹€ 璁よ瘉 鈹€鈹€
  /v1/auth/login:
    post:
      tags: [auth]
      summary: 閭瀵嗙爜鐧诲綍
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                captcha_id: { type: string }
                captcha_code: { type: string }
      responses:
        '200':
          description: 鐧诲綍鎴愬姛锛岃缃?httpOnly cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/register:
    post:
      tags: [auth]
      summary: 鐢ㄦ埛娉ㄥ唽
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                name: { type: string }
      responses:
        '201': { description: 娉ㄥ唽鎴愬姛 }
        '409': { description: 閭宸插瓨鍦?}

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: 鐧诲嚭锛堟竻闄?httpOnly cookie锛?      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: 鐧诲嚭鎴愬姛 }

  /v1/auth/me:
    get:
      tags: [auth]
      summary: 鑾峰彇褰撳墠鐢ㄦ埛
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # 鈹€鈹€ SSO 鈹€鈹€
  /v1/auth/sso/providers:
    get:
      tags: [sso]
      summary: 鍒楀嚭 SSO provider锛堝叕寮€锛?      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SSOProvider' }

  /v1/auth/sso/login/{providerID}:
    get:
      tags: [sso]
      summary: 鍙戣捣 SSO 鐧诲綍锛堥噸瀹氬悜鍒?IdP锛?      parameters:
        - name: providerID
          in: path
          required: true
          schema: { type: string }
      responses:
        '302': { description: 閲嶅畾鍚戝埌 IdP 鎺堟潈 URL }
        '404': { description: provider 涓嶅瓨鍦?}

  # 鈹€鈹€ 鑱婂ぉ 鈹€鈹€
  /v1/agent/submit:
    post:
      tags: [chat]
      summary: 鎻愪氦瀵硅瘽
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, content]
              properties:
                session_id: { type: string }
                content: { type: string }
                model: { type: string, example: deepseek-chat }
      responses:
        '200':
          description: 瀵硅瘽宸叉彁浜わ紝閫氳繃 SSE 娴佸紡杩斿洖
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/agent/events:
    get:
      tags: [chat]
      summary: SSE 浜嬩欢娴侊紙娴佸紡鍝嶅簲锛?      security: [{ cookieAuth: [] }]
      parameters:
        - name: session_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SSE 娴侊紙text/event-stream锛?
  # 鈹€鈹€ 浼佷笟鍔熻兘 鈹€鈹€
  /v1/ent/audit:
    get:
      tags: [enterprise]
      summary: 鎿嶄綔瀹¤鏃ュ織
      description: 闇€瑕?`audit:read` 鏉冮檺
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: start, in: query, schema: { type: string, format: date-time } }
        - { name: end, in: query, schema: { type: string, format: date-time } }
        - { name: user_id, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      logs:
                        type: array
                        items: { $ref: '#/components/schemas/AuditLog' }
                      total: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/ent/roles:
    get:
      tags: [enterprise]
      summary: 瑙掕壊鍒楄〃
      description: 闇€瑕?`ent:manage` 鏉冮檺
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }
    post:
      tags: [enterprise]
      summary: 鍒涘缓瑙掕壊
      security: [{ cookieAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201': { description: 鍒涘缓鎴愬姛 }
        '409': { description: 瑙掕壊鍚嶅凡瀛樺湪 }

  /v1/ent/groups:
    get:
      tags: [enterprise]
      summary: 缇ょ粍鍒楄〃
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Group' }

  /v1/ent/cost/summary:
    get:
      tags: [enterprise]
      summary: 鎴愭湰姹囨€?      security: [{ cookieAuth: [] }]
      parameters:
        - { name: start, in: query, schema: { type: string, format: date } }
        - { name: end, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CostSummary' }

  /v1/ent/quotas:
    get:
      tags: [enterprise]
      summary: 閰嶉姹犲垪琛?      security: [{ cookieAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/QuotaPool' }

  /v1/ent/privacy:
    get:
      tags: [enterprise]
      summary: 闅愮妯″紡閰嶇疆
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PrivacyConfig' }
    put:
      tags: [enterprise]
      summary: 鏇存柊闅愮妯″紡
      security: [{ cookieAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivacyConfig' }
      responses:
        '200': { description: 鏇存柊鎴愬姛 }

  /v1/ent/model-policies:
    get:
      tags: [enterprise]
      summary: 妯″瀷绛栫暐鍒楄〃
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ModelPolicy' }

  /v1/ent/market/items:
    get:
      tags: [enterprise]
      summary: 鑳藉姏甯傚満鏉＄洰
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MarketItem' }

  # 鈹€鈹€ 绯荤粺 鈹€鈹€
  /health:
    get:
      tags: [system]
      summary: 鍋ュ悍妫€鏌?      responses:
        '200':
          description: ok

  /metrics:
    get:
      tags: [system]
      summary: Prometheus 鎸囨爣
      responses:
        '200':
          content:
            text/plain:
              schema: { type: string }

  /v1/system/health:
    get:
      tags: [system]
      summary: 绯荤粺鍋ュ悍璇勫垎
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/HealthScores' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: chiron_token
      description: httpOnly cookie锛岀櫥褰曞悗鑷姩璁剧疆

  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, admin, user] }
        tenant_id: { type: string }

    SSOProvider:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        protocol: { type: string, enum: [oidc, saml] }
        display_name: { type: string }
        enabled: { type: boolean }

    AuditLog:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        ip: { type: string }
        created_at: { type: string, format: date-time }
        details: { type: object }

    Role:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        display_name: { type: string }
        is_builtin: { type: boolean }
        permissions: { type: array, items: { type: string } }

    RoleInput:
      type: object
      properties:
        name: { type: string }
        display_name: { type: string }
        permissions: { type: array, items: { type: string } }

    Group:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        member_count: { type: integer }

    CostSummary:
      type: object
      properties:
        total_cost: { type: number }
        token_usage: { type: integer }
        period: { type: string }

    QuotaPool:
      type: object
      properties:
        id: { type: string }
        resource_type: { type: string }
        total_amount: { type: number }
        period: { type: string, enum: [daily, weekly, monthly] }

    PrivacyConfig:
      type: object
      properties:
        privacy_mode: { type: boolean }
        data_retention_days: { type: integer }
        training_allowed: { type: boolean }

    ModelPolicy:
      type: object
      properties:
        id: { type: string }
        role_id: { type: string }
        allowed_models: { type: array, items: { type: string } }
        rate_limit: { type: object }

    MarketItem:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [plugin, skill] }
        name: { type: string }
        version: { type: string }
        status: { type: string, enum: [draft, published, retired] }

    HealthScores:
      type: object
      properties:
        uptime: { type: number }
        requests_total: { type: integer }
        requests_active: { type: integer }
        llm_calls: { type: integer }
        llm_errors: { type: integer }

  responses:
    Unauthorized:
      description: 鏈璇?      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }

    Forbidden:
      description: 鏉冮檺涓嶈冻
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }

    TooManyRequests:
      description: 闄愭祦
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }

