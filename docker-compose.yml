version: "3.9"

services:
  # 閳光偓閳光偓 閸╄櫣顢呯拋鐐煢 閳光偓閳光偓

  postgres:
    image: pgvector/pgvector:pg16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minicc}
      # P1 安全：生产必须设置强密码；开发环境默认仅本地可访问
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minicc_dev_change_in_production}
      POSTGRES_DB: minicc
    ports:
      # 娴犲懐绮︾€规碍婀伴張鍝勬礀閻滎垽绱濋柆鍨帳閸╄櫣顢呯拋鐐煢閻╁瓨甯撮弳鎾苟閸忣剛缍夐敍鍦?鐎瑰鍙忛崝鐘叉祼閿?
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minicc"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    command: server /data --console-address ":9001"
    ports:
      # 娴犲懐绮︾€规碍婀伴張鍝勬礀閻滎垽绱橲 鐎瑰鍙忛崝鐘叉祼閿?
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      # P1 安全：生产必须设置强密码；开发环境默认仅本地可访问
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 閳光偓閳光偓 Temporal 瀹搞儰缍斿ù浣哥穿閹?閳光偓閳光偓

  temporal:
    image: temporalio/auto-setup:latest
    ports:
      # 娴犲懐绮︾€规碍婀伴張鍝勬礀閻滎垽绱橲 鐎瑰鍙忛崝鐘叉祼閿?
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=minicc
      - POSTGRES_PWD=minicc
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy

  # 閳光偓閳光偓 閺佺増宓佹惔鎾圭讣缁変紮绱欓崚婵嗩潗閸?+ 閸氼垰濮╅弮鑸靛⒔鐞涘矉绱氶埞鈧埞鈧?

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://minicc:minicc@postgres:5432/minicc?sslmode=disable"
    # 鏉╀胶些鐎瑰本鍨氶崥搴ㄢ偓鈧崙鐚寸礉gateway 娓氭繆绂?migrate 閹存劕濮?
    command: ["./migrate", "up"]
    restart: "no"

  # 閳光偓閳光偓 Go 閺堝秴濮熼敍鍫㈢秹閸?+ 娑撴艾濮熼敍?閳光偓閳光偓

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    mem_limit: 1g
    cpus: 2.0
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      POSTGRES_DSN: "postgres://minicc:${POSTGRES_PASSWORD:-minicc_dev_change_in_production}@postgres:5432/minicc?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      STORAGE_BACKEND: "s3"
      S3_ENDPOINT: "minio:9000"
      S3_BUCKET: "minicc-media"
      S3_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
      S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?S3_SECRET_KEY must be set in .env}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env (openssl rand -base64 48)}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      # Python AI 瀵洘鎼搁崷鏉挎絻
      PYTHON_ENGINE_ADDRESS: "python-engine:8000"
      # Temporal 閸︽澘娼?
      TEMPORAL_ADDRESS: "temporal:7233"
      # LLM Provider Keys閿涘湙o 娓氀呮纯鏉╃偟鏁ら敍?
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # Stripe
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
    volumes:
      - workspace:/app/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 閳光偓閳光偓 Python AI 瀵洘鎼搁敍鍫ｅ殰閻?LLM Gateway閿?閳光偓閳光偓

  python-engine:
    build:
      context: python-engine
      dockerfile: Dockerfile
    mem_limit: 2g
    cpus: 2.0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      HTTP_PORT: "8000"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-}@redis:6379"
      POSTGRES_DSN: "postgres://minicc:${POSTGRES_PASSWORD:-minicc_dev_change_in_production}@postgres:5432/minicc?sslmode=disable"
      MILVUS_ADDRESS: "milvus-standalone:19530"
      # LLM Provider Keys
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      # 閸欘垵顫囧ù瀣偓?
      LOG_LEVEL: "INFO"
      OTEL_ENDPOINT: ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 閳光偓閳光偓 Milvus 閸氭垿鍣洪弫鐗堝祦鎼?閳光偓閳光偓

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcddata:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio-setup:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin $MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing myminio/minicc-media;
      "
    restart: "no"

  milvus-standalone:
    image: milvusdb/milvus:v2.5.8
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvusdata:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 閳光偓閳光偓 閸撳秶顏敍鍦磚e 3閿?閳光偓閳光偓

  frontend:
    build:
      context: frontend-vue
      dockerfile: Dockerfile
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      VITE_API_URL: "http://localhost:8080"
      VITE_WS_URL: "ws://localhost:8080"
    restart: unless-stopped

  # 閳光偓閳光偓 Prometheus 閻╂垶甯?閳光偓閳光偓

  prometheus:
    image: prom/prometheus:v3.2.1
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheusdata:/prometheus
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  workspace:
  etcddata:
  milvusdata:
  prometheusdata:
