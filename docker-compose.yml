version: "3.9"

services:
  # 鈹€鈹€ 鍩虹璁炬柦 鈹€鈹€

  postgres:
    image: pgvector/pgvector:pg16-alpine
    environment:
      POSTGRES_USER: minicc
      # 鐢熶骇閮ㄧ讲璇峰姟蹇呮浛鎹负寮哄瘑鐮侊紙S 瀹夊叏鍔犲浐锛?
      POSTGRES_PASSWORD: minicc
      POSTGRES_DB: minicc
    ports:
      # 浠呯粦瀹氭湰鏈哄洖鐜紝閬垮厤鍩虹璁炬柦鐩存帴鏆撮湶鍏綉锛圫 瀹夊叏鍔犲浐锛?
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minicc"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      # 浠呯粦瀹氭湰鏈哄洖鐜紙S 瀹夊叏鍔犲浐锛?
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      # 鐢熶骇閮ㄧ讲璇峰姟蹇呮浛鎹负寮哄瘑鐮侊紙S 瀹夊叏鍔犲浐锛?
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 鈹€鈹€ Temporal 宸ヤ綔娴佸紩鎿?鈹€鈹€

  temporal:
    image: temporalio/auto-setup:latest
    ports:
      # 浠呯粦瀹氭湰鏈哄洖鐜紙S 瀹夊叏鍔犲浐锛?
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=minicc
      - POSTGRES_PWD=minicc
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy

  # 鈹€鈹€ 鏁版嵁搴撹縼绉伙紙鍒濆鍖?+ 鍚姩鏃舵墽琛岋級鈹€鈹€

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://minicc:minicc@postgres:5432/minicc?sslmode=disable"
    # 杩佺Щ瀹屾垚鍚庨€€鍑猴紝gateway 渚濊禆 migrate 鎴愬姛
    command: ["./migrate", "up"]
    restart: "no"

  # 鈹€鈹€ Go 鏈嶅姟锛堢綉鍏?+ 涓氬姟锛?鈹€鈹€

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    mem_limit: 1g
    cpus: 2.0
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      POSTGRES_DSN: "postgres://minicc:minicc@postgres:5432/minicc?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      STORAGE_BACKEND: "s3"
      S3_ENDPOINT: "minio:9000"
      S3_BUCKET: "minicc-media"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin123"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env (openssl rand -base64 48)}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      # Python AI 寮曟搸鍦板潃
      PYTHON_ENGINE_ADDRESS: "python-engine:8000"
      # Temporal 鍦板潃
      TEMPORAL_ADDRESS: "temporal:7233"
      # LLM Provider Keys锛圙o 渚х洿杩炵敤锛?
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # Stripe
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
    volumes:
      - workspace:/app/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 鈹€鈹€ Python AI 寮曟搸锛堣嚜鐮?LLM Gateway锛?鈹€鈹€

  python-engine:
    build:
      context: python-engine
      dockerfile: Dockerfile
    mem_limit: 2g
    cpus: 2.0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      HTTP_PORT: "8000"
      REDIS_URL: "redis://redis:6379"
      POSTGRES_DSN: "postgres://minicc:minicc@postgres:5432/minicc?sslmode=disable"
      MILVUS_ADDRESS: "milvus-standalone:19530"
      # LLM Provider Keys
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      # 鍙娴嬫€?
      LOG_LEVEL: "INFO"
      OTEL_ENDPOINT: ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 鈹€鈹€ Milvus 鍚戦噺鏁版嵁搴?鈹€鈹€

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcddata:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio-setup:
    image: minio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin $MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing myminio/minicc-media;
      "
    restart: "no"

  milvus-standalone:
    image: milvusdb/milvus:latest
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvusdata:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 鈹€鈹€ 鍓嶇锛圴ue 3锛?鈹€鈹€

  frontend:
    build:
      context: frontend-vue
      dockerfile: Dockerfile
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      VITE_API_URL: "http://localhost:8080"
      VITE_WS_URL: "ws://localhost:8080"
    restart: unless-stopped

  # 鈹€鈹€ Prometheus 鐩戞帶 鈹€鈹€

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheusdata:/prometheus
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  workspace:
  etcddata:
  milvusdata:
  prometheusdata:
